<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة البرومبتات الذكية - Prompt Master</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        header {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            padding: 20px 0;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border-bottom: 2px solid #667eea;
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav {
            display: flex;
            gap: 30px;
        }

        .nav a {
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
            padding: 8px 15px;
            border-radius: 5px;
        }

        .nav a:hover {
            background: #667eea;
            color: white;
        }

        .contact-info {
            color: #667eea;
            font-weight: bold;
            font-size: 14px;
        }

        .container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .hero-section {
            text-align: center;
            color: white;
            margin-bottom: 60px;
            animation: fadeInDown 0.8s ease-out;
        }

        .hero-section h1 {
            font-size: 48px;
            margin-bottom: 15px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .hero-section p {
            font-size: 18px;
            margin-bottom: 30px;
            opacity: 0.95;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 60px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 60px rgba(102, 126, 234, 0.3);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }

        .output-box {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 8px;
            min-height: 150px;
            word-wrap: break-word;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            color: #333;
            margin-top: 20px;
        }

        .copy-btn {
            background: #667eea;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .copy-btn:hover {
            background: #764ba2;
        }

        .prompts-library {
            margin-top: 60px;
        }

        .prompts-library h2 {
            text-align: center;
            color: white;
            font-size: 36px;
            margin-bottom: 40px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .prompts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 60px;
        }

        .prompt-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .prompt-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(102, 126, 234, 0.3);
        }

        .prompt-category {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .prompt-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 12px;
        }

        .prompt-description {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .prompt-text {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
            color: #333;
            border-left: 3px solid #667eea;
            margin-bottom: 15px;
            max-height: 120px;
            overflow-y: auto;
        }

        .prompt-actions {
            display: flex;
            gap: 10px;
        }

        .prompt-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-copy {
            background: #667eea;
            color: white;
        }

        .btn-copy:hover {
            background: #764ba2;
        }

        .btn-edit {
            background: #f0f0f0;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-edit:hover {
            background: #667eea;
            color: white;
        }

        .tips-section {
            background: white;
            border-radius: 15px;
            padding: 40px;
            margin-bottom: 60px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .tips-section h2 {
            color: #667eea;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .tips-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .tip-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .tip-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.3);
        }

        .tip-card h3 {
            margin-bottom: 15px;
            font-size: 18px;
        }

        .tip-card p {
            font-size: 14px;
            line-height: 1.7;
            opacity: 0.95;
        }

        footer {
            background: rgba(0, 0, 0, 0.9);
            color: white;
            text-align: center;
            padding: 30px;
            margin-top: 80px;
            border-top: 2px solid #667eea;
        }

        .footer-content {
            max-width: 1400px;
            margin: 0 auto;
        }

        .footer-credit {
            color: #667eea;
            font-weight: bold;
            margin-top: 15px;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-message {
            background: #4caf50;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
            display: none;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .hero-section h1 {
                font-size: 32px;
            }

            .prompts-grid {
                grid-template-columns: 1fr;
            }

            .nav {
                gap: 15px;
                font-size: 12px;
            }

            .tips-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-container">
            <div class="logo">✨ Prompt Master</div>
            <nav class="nav">
                <a href="#home">الرئيسية</a>
                <a href="#generator">المولد</a>
                <a href="#library">المكتبة</a>
                <a href="#tips">النصائح</a>
            </nav>
            <div class="contact-info">
                🔱 Baraka Digital | مشرف: عبد الله أحمد
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container">
        <!-- Hero Section -->
        <div class="hero-section" id="home">
            <h1>🚀 مرحباً بك في منصة البرومبتات الذكية</h1>
            <p>تعلم كيفية إنشاء بروميبتات احترافية وقوية لنماذج الذكاء الاصطناعي</p>
        </div>

        <!-- Main Content Grid -->
        <div class="main-content">

            <div class="card" id="generator">

                <div class="form-group">

                        <option value="technical">تقني</option>
                        <option value="business">أعمال</option>
                        <option value="educational">تعليمي</option>
                        <option value="marketing">تسويق</option>
                        <option value="seo">تحسين محركات البحث</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>وصف موضوعك:</label>
                    <textarea id="userDescription" placeholder="اكتب وصفاً مفصلاً لما تريده..."></textarea>
                </div>

                <div class="form-group">
                    <label>الكلمات المفتاحية (اختياري):</label>
                    <input type="text" id="keywords" placeholder="مثال: ذكاء اصطناعي، تصميم، برمجة...">
                </div>

                <div class="form-group">
                    <label>مستوى التفصيل:</label>
                    <select id="detailLevel">
                        <option value="brief">موجز</option>
                        <option value="moderate">متوسط</option>
                        <option value="detailed">تفصيلي</option>
                    </select>
                </div>

                <div class="button-group">
                    <button class="btn-primary" onclick="generatePrompt()">توليد البرومبت 🔮</button>
                    <button class="btn-secondary" onclick="clearForm()">مسح 🗑️</button>
                </div>

                <div class="success-message" id="successMessage">تم النسخ بنجاح! ✓</div>

                <div id="outputBox" class="output-box" style="display: none;">
                    <div id="generatedPrompt"></div>
                    <button class="copy-btn" onclick="copyPrompt()">نسخ البرومبت 📋</button>
                </div>
            </div>
